name: Build Phantom Client

on:
  push:
    paths:
      - "PhantomClient-GitHub-Ready-Build.zip"
      - ".github/workflows/build-phantom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source
        run: unzip -q PhantomClient-GitHub-Ready-Build.zip -d source

      - name: Build JAR
        run: |
          cd source
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PhantomClient
          path: source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30